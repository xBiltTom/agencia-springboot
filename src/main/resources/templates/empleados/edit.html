<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/plantilla :: head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <aside th:replace="layout/plantilla :: aside"></aside>
    <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
        <!-- Navbar -->
        <nav class="navbar navbar-main navbar-expand-lg px-0 mx-3 shadow-none border-radius-xl" id="navbarBlur" data-scroll="true">
          <div class="container-fluid py-1 px-3">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
                <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="javascript:;">Pages</a></li>
                <li class="breadcrumb-item text-sm text-dark active" aria-current="page"><a th:href="@{/empleados}">Empleados</a></li>
                <li class="breadcrumb-item text-sm text-dark active" aria-current="page">Editar</li>
              </ol>
            </nav>
          </div>
        </nav>
        <!-- End Navbar -->
        <div class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
            <div class="row">
              <div class="ms-3">
                <h3 class="mb-0 h4 font-weight-bolder">Empleados</h3>
                <p class="mb-4">
                  Editando este empleado
                </p>
              </div>
            </div>
          </div>

          <div class="container-fluid py-2">
            <div class="row">
              <div class="col-12">
                <div class="card my-4">
                  <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
                    <div class="bg-gradient-primary shadow-primary border-radius-lg pt-4 pb-3">
                      <h6 class="text-white text-capitalize ps-3">Editar empleado</h6>
                    </div>
                  </div>
                  <div class="card-body px-4 pb-2">
                    <form id="formulario" th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
                      <input type="hidden" th:field="*{id}" th:value="${empleado.id}" />
                      <!-- DNI -->
                      <div class="input-group input-group-outline my-3 is-filled">
                        <label class="form-label">DNI</label>
                        <input type="text" th:field="*{dni}" class="form-control" maxlength="8" required pattern="[0-9]{8}" title="El DNI debe tener 8 dígitos numéricos">
                      </div>
                      
                      <!-- Nombre -->
                      <div class="input-group input-group-outline my-3 is-filled">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" maxlength="30" required>
                      </div>
                      
                      <!-- Apellido -->
                      <div class="input-group input-group-outline my-3 is-filled">
                        <label class="form-label">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control" maxlength="30" required>
                      </div>
                      
                      <!-- Email -->
                      <div class="input-group input-group-outline my-3 is-filled">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" maxlength="50" required>
                      </div>
                      
                      <!-- Teléfono -->
                      <div class="input-group input-group-outline my-3 is-filled">
                        <label class="form-label">Teléfono</label>
                        <input type="tel" th:field="*{telefono}" class="form-control" maxlength="9" required pattern="[0-9]{9}" title="El teléfono debe tener 9 dígitos numéricos">
                      </div>
                      
                      <!-- Botones -->
                      <div class="text-end">
                        <a th:href="@{/empleados}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn bg-gradient-primary">Guardar</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
      

      </main>

      <!--   Core JS Files   -->
      <script th:src="@{/assets/js/core/popper.min.js}"></script>
      <script th:src="@{/assets/js/core/bootstrap.min.js}"></script>
      <script th:src="@{/assets/js/plugins/perfect-scrollbar.min.js}"></script>
      <script th:src="@{/assets/js/plugins/smooth-scrollbar.min.js}"></script>
      <script th:src="@{/assets/js/plugins/chartjs.min.js}"></script>
  <script>
    document.getElementById('formulario').addEventListener('submit', function(event) {
    event.preventDefault();
    const form = this; 
    Swal.fire({
        title: "¿Editar registro?",
        text: "¿Estás seguro de editar este empleado?",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#3085d6",
        cancelButtonColor: "#d33",
        confirmButtonText: "Sí, editar",
        cancelButtonText: "Cancelar"
    }).then((result) => {
        if (result.isConfirmed) {
        form.submit();
        }
    });
    });
  </script>
  
  <!-- Github buttons -->
  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <!-- Control Center for Material Dashboard: parallax effects, scripts for the example pages etc -->
  <script th:src="@{/assets/js/material-dashboard.min.js?v=3.2.0}"></script>
      
</body>
</html>
