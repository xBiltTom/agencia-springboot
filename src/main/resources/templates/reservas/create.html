<!DOCTYPE html>
<html lang="en">
<head th:replace="layout/plantilla :: head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <aside th:replace="layout/plantilla :: aside"></aside>
    <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
        <!-- Navbar -->
        <nav class="navbar navbar-main navbar-expand-lg px-0 mx-3 shadow-none border-radius-xl" id="navbarBlur" data-scroll="true">
          <div class="container-fluid py-1 px-3">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
                <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="javascript:;">Pages</a></li>
                <li class="breadcrumb-item text-sm text-dark active" aria-current="page"><a th:href="@{/reservas}">Reservas</a></li>
                <li class="breadcrumb-item text-sm text-dark active" aria-current="page">Registrar</li>
              </ol>
            </nav>
          </div>
        </nav>
        <!-- End Navbar -->
        <div class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
            <div class="row">
              <div class="ms-3">
                <h3 class="mb-0 h4 font-weight-bolder">Reservas</h3>
                <p class="mb-4">
                  Registrar una reserva
                </p>
              </div>
            </div>
          </div>

          <div class="container-fluid py-2">
            <div class="row">
              <div class="col-12">
                <div class="card my-4">
                  <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
                    <div class="bg-gradient-primary shadow-primary border-radius-lg pt-4 pb-3">
                      <h6 class="text-white text-capitalize ps-3">Nueva reserva</h6>
                    </div>
                  </div>
                  <div class="card-body px-4 pb-2">
                    <form id="formulario" th:action="@{/reservas/guardar}" th:object="${reserva}" method="post">
                        <!-- Fecha de Reserva -->
                        <div class="input-group input-group-outline my-3 is-filled">
                          <label class="form-label">Fecha de Reserva</label>
                          <input type="date" th:field="*{fechaReserva}" class="form-control" required>
                        </div>
                        
                        <!-- Cliente -->
                        <div class="input-group input-group-static mb-4">
                          <label for="cliente" class="ms-0">Cliente</label>
                          <select class="form-control" id="cliente" th:field="*{cliente.id}" required>
                            <option value="">Seleccione un cliente</option>
                            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre + ' ' + cliente.apellido + ' - ' + cliente.id}"></option>
                          </select>
                        </div>
                      
                        <!-- Viaje -->
                        <div class="input-group input-group-static mb-4">
                          <label for="viaje" class="ms-0">Viaje</label>
                          <select class="form-control" id="viaje" th:field="*{viaje.id}" required>
                            <option value="">Seleccione un viaje</option>
                            <option th:each="viaje : ${viajes}" th:value="${viaje.id}" 
                                    th:text="${viaje.destino + ' - Salida: ' + #dates.format(viaje.fechaSalida, 'dd/MM/yyyy')}"></option>
                          </select>
                        </div>
                        
                        <!-- Estado de Reserva -->
                        <div class="input-group input-group-static mb-4">
                          <label for="estadoReserva" class="ms-0">Estado</label>
                          <select class="form-control" id="estadoReserva" th:field="*{estadoReserva.id}" required>
                            <option value="">Seleccione un estado</option>
                            <option th:each="estado : ${estados}" th:value="${estado.id}" th:text="${estado.descripcion}"></option>
                          </select>
                        </div>
                      
                        <!-- Empleado (agente) -->
                        <div class="input-group input-group-static mb-4">
                          <label for="empleado" class="ms-0">Empleado asignado</label>
                          <select class="form-control" id="empleado" th:field="*{empleado.id}" required>
                            <option value="">Seleccione un empleado</option>
                            <option th:each="empleado : ${empleados}" th:value="${empleado.id}" th:text="${empleado.nombre + ' ' + empleado.apellido}"></option>
                          </select>
                        </div>
                        
                        <!-- Seguros (opcional) -->
                       <!-- Seguros (opcional) -->
                        <div class="card p-3 mb-4">
                            <h6 class="mb-3">Seguros opcionales</h6>
                            
                            <div class="row">
                            <div th:each="seguro : ${seguros}" class="col-md-6 col-lg-4 mb-3">
                                <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                        th:id="'seguro-' + ${seguro.id}" 
                                        name="segurosIds" 
                                        th:value="${seguro.id}">
                                <label class="form-check-label" th:for="'seguro-' + ${seguro.id}">
                                    <span class="d-block" th:text="${seguro.descripcion}"></span>
                                    <span class="text-primary font-weight-bold" th:text="'S/ ' + ${seguro.precio}"></span>
                                </label>
                                </div>
                            </div>
                            
                            <!-- Mensaje si no hay seguros disponibles -->
                            <div class="col-12" th:if="${#lists.isEmpty(seguros)}">
                                <p class="text-muted">No hay seguros disponibles.</p>
                            </div>
                            </div>
                        </div>
                        
                        <!-- Botones -->
                        <div class="text-end">
                          <a th:href="@{/reservas}" class="btn btn-outline-secondary me-2">Cancelar</a>
                          <button type="submit" class="btn bg-gradient-primary">Guardar</button>
                        </div>
                      </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
      

      </main>

      <!--   Core JS Files   -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/chartjs.min.js"></script>
  <script>
    document.getElementById('formulario').addEventListener('submit', function(event) {
    event.preventDefault(); 
    const form = this; 
    Swal.fire({
        title: "¿Confirmar registro?",
        text: "¿Estás seguro de registrar esta reserva?",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#3085d6",
        cancelButtonColor: "#d33",
        confirmButtonText: "Sí, registrar",
        cancelButtonText: "Cancelar"
    }).then((result) => {
        if (result.isConfirmed) {
        form.submit();
        }
    });
    });
  </script>

  <!-- Github buttons -->
  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <!-- Control Center for Material Dashboard: parallax effects, scripts for the example pages etc -->
  <script src="../assets/js/material-dashboard.min.js?v=3.2.0"></script>
      
</body>
</html>
